version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: realtime_analytics_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-realtime_analytics}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/real_time_queries.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d realtime_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - analytics_net

  stream-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realtime_stream_pipeline
    restart: unless-stopped
    command: python -m src.stream_processor --rate 15 --count 0
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: realtime_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - analytics_net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realtime_analytics_dashboard
    restart: unless-stopped
    command: streamlit run src/dashboard.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    ports:
      - "8501:8501"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: realtime_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - analytics_net

  metabase:
    image: metabase/metabase:latest
    container_name: realtime_analytics_metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - analytics_net

volumes:
  pgdata:
  metabase_data:

networks:
  analytics_net:
    driver: bridge
